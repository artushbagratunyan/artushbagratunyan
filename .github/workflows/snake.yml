name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the red contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: artushbagratunyan
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23ff4058&color_dots=%230d1117,%23321a20,%237b2636,%23c8324c,%23ff526b

      - name: Publish the SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
